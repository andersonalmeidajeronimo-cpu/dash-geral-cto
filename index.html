<title>Dash Geral CTO</title>
<meta name="description" content="Acesso restrito.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<body class="trancado">
<section class="cofre" id="cofre" hidden>
  <form class="cofre-card" id="cofre-form" autocomplete="on">
    <p class="eyebrow">Acesso restrito</p>
    <h1>Dash Geral CTO. <span>Digite a senha do time.</span></h1>
    <input type="text" name="username" value="dash-geral-cto" autocomplete="username" hidden>
    <label class="cofre-lab" for="senha">Senha</label>
    <input class="cofre-in" id="senha" name="password" type="password" autocomplete="current-password" required>
    <label class="cofre-check"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button class="btn dark cofre-btn" id="entrar" type="submit">Entrar</button>
    <p class="cofre-msg" id="cofre-msg" role="alert"></p>
  </form>
</section>
<nav class="gnav"><div class="gnav-in" id="gnav"></div></nav>
<div class="fbar"><div class="fbar-in" id="fbar"></div></div>
<main id="app"><div class="loading">Carregando o dash…</div></main>
<footer id="rodape"></footer>
<div class="tip" id="tip"></div>
<script src="data/data.enc.js?v=ab1ce47bf1"></script>
